<!DOCTYPE html>
<html>
<head>
<title>RBA Login</title>
</head>

<body>

<h2>Risk Based Authentication</h2>

<form method="POST">

Username:
<input type="text" name="username">

<br><br>

Password:
<input type="password" name="password">

<br><br>

<h3>Simulated Risk Factors</h3>

<input type="checkbox" name="new_device">
New Device

<br>

<input type="checkbox" name="new_location">
New Location

<br>

<input type="checkbox" name="failed_attempt">
Multiple Failed Attempts

<br><br>

<button type="submit">
Login
</button>

</form>

</body>
</html>
